[project]
name = "gpt-2-124m"
version = "0.1.0"
description = "Recreating the GPT 2 124M Model"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "datasets>=4.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=1.26.4",
    "requests>=2.32.5",
    "tiktoken>=0.12.0",
    "torch>=2.9.0",
    "tqdm>=4.67.1",
    "transformers>=4.57.1",
    "triton-windows>=3.8.0.post28",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130"},
]
torchvision = [
  { index = "pytorch-cu130"},
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
